# Keyless user-message-edit composition for the assembled headless snapshot:
# the DeepSeek adapter is replaced by llm-replay, which serves the recorded
# two-turn transcript from the scenario's session.jsonl fixture.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  models:
                    - id: deepseek-v4-flash
                      contextWindow: 128000
