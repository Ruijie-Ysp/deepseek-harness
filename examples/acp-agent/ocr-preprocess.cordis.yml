# OCR-preprocess scenario overlay: adds the OCR preprocessing plugin with a
# dedicated OCR route and keeps the main route text-only, so an inline image
# prompt is admitted and converted to recognized text before the main model
# sees it. The app config is restated to re-pin `deepseek-v4-flash` (base ships
# pro; the authored fixture and the pinned header class are flash), because a
# config patch replaces the whole app config. Keyless replay supplies its own
# exact OCR-capable catalog while the production endpoint remains unavailable.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-flash
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: attachment-local
            name: '@deepseek-ai/dsh-attachment-local'
          - id: ocr-preprocess
            name: '@deepseek-ai/dsh-ocr-preprocess'
            config:
              provider: ocr-replay
              model: ovisocr2
