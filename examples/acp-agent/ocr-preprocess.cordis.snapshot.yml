# Keyless replay for the OCR-preprocess scenario: identical to the live overlay
# except the replay catalog replaces the deepseek provider and supplies the
# dedicated OCR route. Flash stays text-only — the OCR plugin converts the
# admitted inline image to text before it reaches the main model.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-flash
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: attachment-local
            name: '@deepseek-ai/dsh-attachment-local'
          - id: ocr-preprocess
            name: '@deepseek-ai/dsh-ocr-preprocess'
            config:
              provider: ocr-replay
              model: ovisocr2
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                      inputModalities: [text]
                    - id: deepseek-v4-pro
                      inputModalities: [text]
                - id: ocr-replay
                  name: OCR Replay
                  models:
                    - id: ovisocr2
                      inputModalities: [text, image]
